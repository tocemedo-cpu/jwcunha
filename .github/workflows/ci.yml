name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jwc_test
          POSTGRES_USER: jwc
          POSTGRES_PASSWORD: jwc_dev_only # throwaway CI database, not a real credential
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jwc -d jwc_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (Flyway migrates the schema, Hibernate validates it)
        run: mvn -B verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/jwc_test
          TEST_DB_USER: jwc
          TEST_DB_PASSWORD: jwc_dev_only

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: |
          printf 'POSTGRES_DB=x\nPOSTGRES_USER=x\nPOSTGRES_PASSWORD=x\n' > ci.env
          docker compose --env-file ci.env config -q
      - name: Build images
        run: |
          docker build -t jwc-backend ./backend
          docker build -t jwc-frontend ./frontend
