server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: jwcunha-website
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jwc_dev}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX:5}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:600}
