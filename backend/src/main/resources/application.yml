server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: jwcunha-website
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jwc_dev}}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX:5}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:600}
  admin-throttle:
    max-failures: 10
    window-seconds: 900
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    to: ${MAIL_NOTIFY_TO:}
    max-attempts: 5
    retry-delay-ms: 300000        # how often failed/pending notifications are retried
    retry-min-age-seconds: 120    # do not retry a request younger than this (the first attempt is still running)
