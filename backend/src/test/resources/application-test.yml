spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/jwc_test}
    username: ${TEST_DB_USER:jwc}
    password: ${TEST_DB_PASSWORD:jwc_dev_only}
  flyway:
    clean-disabled: false
app:
  rate-limit:
    max-requests: 1000
  mail:
    retry-delay-ms: 3600000   # the scheduler must not interfere with tests; they call retryPending() directly
